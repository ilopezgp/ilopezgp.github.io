<footer class="footer">
  {% include social-icons.html %}
  <div class="post-date"><a href="{{ site.github.url }}/">{{ site.title }} | All rights reserved. </a></div>
</footer>

<script type="text/javascript">
document.addEventListener("DOMContentLoaded", function() {
  // 1. Automatic Visual Tags for publications & Auto-Cite Button
  const links = document.querySelectorAll("a");
  links.forEach(link => {
    const text = link.textContent.trim().toLowerCase();
    if (text === "doi") {
      link.classList.add("tag-doi");
      
      // Create Cite Button
      const btn = document.createElement("span");
      btn.className = "cite-btn";
      btn.textContent = "Cite";
      btn.title = "Copy official BibTeX citation";
      link.parentNode.insertBefore(btn, link.nextSibling);

      // Click handler
      btn.addEventListener("click", function(e) {
        e.preventDefault();
        e.stopPropagation();

        const url = link.href;
        let doi = "";
        
        // Extract DOI from URL
        const doiMatch = url.match(/doi\.org\/(10\.\d{4,9}\/[-._;()/:A-Za-z0-9]+)/);
        if (doiMatch) {
          doi = doiMatch[1];
        } else {
          const genericMatch = url.match(/\/(10\.\d{4,9}\/[-._;()/:A-Za-z0-9]+)/);
          if (genericMatch) doi = genericMatch[1];
        }

        const fallbackCopy = () => {
          // Robust fallback using execCommand
          const el = document.createElement('textarea');
          el.value = url;
          el.style.position = 'absolute';
          el.style.left = '-9999px';
          document.body.appendChild(el);
          el.select();
          try {
            document.execCommand('copy');
            btn.textContent = "URL Copied!";
          } catch (err) {
            console.error('Fallback copy failed', err);
            btn.textContent = "Copy Failed";
          }
          document.body.removeChild(el);
          
          btn.classList.add("error");
          setTimeout(() => {
            btn.textContent = "Cite";
            btn.classList.remove("error");
          }, 2000);
        };

        if (!doi) {
          fallbackCopy();
          return;
        }

        btn.textContent = "Loading...";
        fetch(`https://api.crossref.org/works/${doi}/transform/application/x-bibtex`)
          .then(response => {
            if (!response.ok) throw new Error("Not found");
            return response.text();
          })
          .then(bibtex => {
            navigator.clipboard.writeText(bibtex).then(() => {
              btn.textContent = "Copied!";
              btn.classList.add("copied");
              setTimeout(() => {
                btn.textContent = "Cite";
                btn.classList.remove("copied");
              }, 2000);
            });
          })
          .catch(err => {
            console.error("Cite fetch failed:", err);
            fallbackCopy();
          });
      });
    } else if (text === "pdf") {
      link.classList.add("tag-pdf");
    }
  });

  // 2. Real-Time Filter for Publications index
  const filterInput = document.getElementById("publications-filter");
  if (filterInput) {
    // Find all publication blocks (paragraphs in the main content area)
    const publications = Array.from(document.querySelectorAll(".post-container p")).filter(p => {
      return !p.closest(".filter-container"); // Protect the filter from itself
    });

    filterInput.addEventListener("input", function() {
      const filterValue = filterInput.value.trim().toLowerCase();

      publications.forEach(pub => {
        const text = pub.textContent.toLowerCase();
        
        if (text.includes(filterValue)) {
          pub.classList.remove("publication-hidden");
          pub.style.opacity = "1"; // Smooth transition if you want!
        } else {
          pub.classList.add("publication-hidden");
        }
      });
    });
  }

  // 3. Media Source Logos
  if (window.location.pathname.includes('media')) {
    const mediaLinks = document.querySelectorAll(".post-container p a");
    mediaLinks.forEach(link => {
      try {
        const url = new URL(link.href);
        const hostname = url.hostname;
        
        let baseDomain = hostname;
        const parts = hostname.split('.');
        if (parts.length > 2) {
          if (parts[parts.length - 2].length <= 3 && parts[parts.length - 1].length <= 3) {
            baseDomain = parts.slice(-3).join('.'); // e.g., bbc.co.uk
          } else {
            baseDomain = parts.slice(-2).join('.'); // e.g., blog.google.com -> google.com
          }
        }
        
        // Special case for .google TLD (e.g., research.google, blog.google)
        if (baseDomain.endsWith('.google')) {
          baseDomain = 'google.com';
        }
        
        const logo = document.createElement("img");
        logo.className = "media-logo";
        logo.alt = `${baseDomain} logo`;
        
        // Try getting a high-res logo from Clearbit using the base domain
        logo.src = `https://logo.clearbit.com/${baseDomain}`;
        
        // Fallback to Google favicons using the baseDomain if Clearbit doesn't have it
        logo.onerror = function() {
          // Prevent infinite loop if fallback also fails
          if (!this.src.includes('s2/favicons')) { 
            this.src = `https://www.google.com/s2/favicons?domain=${baseDomain}&sz=128`;
          }
        };
        
        // Skip if already processed (e.g., multiple links)
        if (link.parentNode.classList.contains('media-text-content')) return;

        const parentP = link.parentNode;
        
        // Create wrapper for text to avoid detaching text nodes under flex layout
        const textWrapper = document.createElement('div');
        textWrapper.className = 'media-text-content';
        
        while (parentP.firstChild) {
          textWrapper.appendChild(parentP.firstChild);
        }
        
        parentP.appendChild(textWrapper);
        parentP.appendChild(logo);
        
        parentP.style.display = 'flex';
        parentP.style.alignItems = 'center';
        parentP.style.justifyContent = 'space-between';
        parentP.style.marginBottom = '1.5rem';
      } catch (e) {
        // invalid URL or relative link, ignore
      }
    });
  }
});
</script>
